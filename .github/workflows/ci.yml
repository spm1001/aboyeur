name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

# The sonnette-bundle-fresh job lived here until 2026-08-24 (son-pilalu). It
# rebuilt sonnette/conductor-channel.js under a pinned bun and diffed it against
# the committed copy, because the batterie assembler vendors source trees without
# node_modules and a src/ edit without a rebuild would have shipped a stale
# bundle silently. It did its job well — traps.md still cites it as the example
# of a guard that fires correctly and gets ignored. Removed with the mesh code
# it guarded: sonnette was delisted from the marketplace, so there is no bundle,
# no plugin and nothing to keep fresh. Recover it with:
#   git log -S sonnette-bundle-fresh -- .github/workflows/ci.yml
